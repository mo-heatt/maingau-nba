name: Deploy

# Optional immediate deploy over SSH. The workshop VM also runs its own
# watch-deploy.sh cron, which deploys without any GitHub configuration.
# To enable this workflow, add these repository secrets (Settings -> Secrets
# and variables -> Actions -> New repository secret):
#   DEPLOY_SSH_KEY  — private key of the deploy keypair (public key is on the VM)
#   DEPLOY_HOST     — 130.83.85.181
#   DEPLOY_PORT     — 41022
#   DEPLOY_USER     — wsvm41-admin

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [prod, dev]
        default: dev

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Check deploy secrets
        id: secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_SSH_KEY is not configured; the VM watcher deploys automatically within ~2 minutes."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.secrets.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/deploy_key
          ssh -i ~/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "flock -n /tmp/nba-deploy.lock /srv/maingau-nba/repo/scripts/deploy-one.sh '$ENVIRONMENT'"
          rm -f ~/deploy_key

# MAINGAU NBA edge router on the workshop VM.
# External mapping: 41080 -> 80 (prod, branch main) and 41443 -> 443 (dev, branch dev).
#
# Upstreams are resolved via Docker's embedded DNS at request time so that one
# environment being down (rebuild, crash) never stops the other: nginx returns
# 502 for the affected location instead of failing to start.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    set $upstream_prod app-prod:8001;

    location / {
        proxy_pass http://$upstream_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Self-signed certificate generated on the VM; browsers show a one-time warning.
    ssl_certificate     /etc/nginx/tls/selfsigned.crt;
    ssl_certificate_key /etc/nginx/tls/selfsigned.key;

    set $upstream_dev app-dev:8001;

    location / {
        proxy_pass http://$upstream_dev;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }
}

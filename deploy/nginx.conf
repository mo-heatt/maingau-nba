# MAINGAU NBA edge router on the workshop VM.
# External mapping: 41080 -> 80 (prod, branch main) and 41443 -> 443 (dev, branch dev).

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://app-prod:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Self-signed certificate generated on the VM; browsers show a one-time warning.
    ssl_certificate     /etc/nginx/tls/selfsigned.crt;
    ssl_certificate_key /etc/nginx/tls/selfsigned.key;

    location / {
        proxy_pass http://app-dev:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }
}
